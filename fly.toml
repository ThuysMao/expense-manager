# fly.toml app configuration file generated for expense-manager-still-smoke-1007 on 2026-08-11T11:30:26+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quanlytaichinh'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "sqlite_data"
  destination = "/data"

[env]
  DB_PATH = "/data/expense_manager.db"
