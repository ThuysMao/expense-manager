<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Đăng nhập - Ứng dụng quản lý chi tiêu cá nhân thông minh">
  <meta name="theme-color" content="#7C3AED">
  <title>Đăng nhập - Quản lý tài chính</title>

  <!-- Stylesheets (Using Main App CSS) -->
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/animations.css">

  <style>
    /* Specific styles for login that extend the design system */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--color-gray-100);
      background-image: radial-gradient(circle at top right, rgba(124, 58, 237, 0.1), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.1), transparent 40%);
    }

    .dark-theme body {
      background: var(--color-gray-50);
      background-image: radial-gradient(circle at top right, rgba(124, 58, 237, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.15), transparent 40%);
    }

    .auth-wrapper {
      width: 100%;
      max-width: 400px;
      padding: var(--space-4);
      animation: fadeUp var(--transition-slow) forwards;
    }

    .auth-card {
      background-color: var(--color-white);
      border-radius: var(--radius-2xl);
      padding: var(--space-8) var(--space-6);
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--color-gray-200);
      position: relative;
      overflow: hidden;
    }

    .dark-theme .auth-card {
      border-color: var(--color-gray-200);
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .auth-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto var(--space-4);
      background: var(--gradient-wallet);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: var(--shadow-wallet);
    }

    .auth-title {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-extrabold);
      color: var(--color-gray-900);
      margin-bottom: var(--space-2);
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: var(--font-size-sm);
      color: var(--color-gray-500);
    }

    .auth-switch-text {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--font-size-sm);
      color: var(--color-gray-500);
    }

    .auth-switch-link {
      color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      margin-left: var(--space-1);
    }

    .auth-switch-link:hover {
      text-decoration: underline;
    }

    .error-alert {
      background-color: var(--color-danger-light);
      color: var(--color-danger-dark);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      margin-bottom: var(--space-4);
      display: none;
      animation: shake 0.5s;
    }
  </style>

  <!-- Theme Script (Loads before rendering to avoid flash) -->
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark-theme');
    }
  </script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Lớp trang trí -->
      <div style="position: absolute; top: -50px; right: -50px; width: 100px; height: 100px; background: var(--color-primary); opacity: 0.1; filter: blur(30px); border-radius: 50%;"></div>
      <div style="position: absolute; bottom: -50px; left: -50px; width: 100px; height: 100px; background: var(--color-accent); opacity: 0.1; filter: blur(30px); border-radius: 50%;"></div>

      <!-- Đăng nhập Form -->
      <div id="loginForm">
        <div class="auth-header">
          <div class="auth-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/>
            </svg>
          </div>
          <h1 class="auth-title">Chào mừng trở lại!</h1>
          <p class="auth-subtitle">Đăng nhập để tiếp tục quản lý tài chính</p>
        </div>

        <div class="error-alert" id="loginError"></div>

        <div class="form-group">
          <label class="form-label">Tên đăng nhập</label>
          <div class="input-group">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <input type="text" class="input-field" id="loginUsername" placeholder="Nhập tên đăng nhập" autocomplete="username">
          </div>
        </div>

        <div class="form-group mb-6">
          <label class="form-label">Mật khẩu</label>
          <div class="input-group">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input type="password" class="input-field" id="loginPassword" placeholder="Nhập mật khẩu" autocomplete="current-password">
          </div>
        </div>

        <button class="btn btn-primary w-full" style="padding: var(--space-4);" onclick="login()">
          Đăng nhập
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>

        <div class="auth-switch-text">
          Chưa có tài khoản?<span class="auth-switch-link" onclick="toggleForm('register')">Đăng ký ngay</span>
        </div>
      </div>

      <!-- Đăng ký Form -->
      <div id="registerForm" style="display: none;">
        <div class="auth-header">
          <div class="auth-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
          </div>
          <h1 class="auth-title">Tạo tài khoản</h1>
          <p class="auth-subtitle">Bắt đầu hành trình quản lý tài chính</p>
        </div>

        <div class="error-alert" id="registerError"></div>

        <div class="form-group">
          <label class="form-label">Tên hiển thị</label>
          <div class="input-group">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <input type="text" class="input-field" id="regName" placeholder="VD: Nguyễn Văn A">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Tên đăng nhập</label>
          <div class="input-group">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            </div>
            <input type="text" class="input-field" id="regUsername" placeholder="Tên đăng nhập viết liền">
          </div>
        </div>

        <div class="form-group mb-6">
          <label class="form-label">Mật khẩu</label>
          <div class="input-group">
            <div class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input type="password" class="input-field" id="regPassword" placeholder="Mật khẩu (ít nhất 4 ký tự)">
          </div>
        </div>

        <button class="btn btn-primary w-full" style="padding: var(--space-4);" onclick="register()">
          Đăng ký
        </button>

        <div class="auth-switch-text">
          Đã có tài khoản?<span class="auth-switch-link" onclick="toggleForm('login')">Đăng nhập</span>
        </div>
      </div>

    </div>

    <div style="text-align: center; margin-top: var(--space-6); font-size: var(--font-size-xs); color: var(--color-gray-500);">
      &copy; 2026 Bản quyền thuộc về <b>Thuysmao</b>. Mọi quyền được bảo lưu.
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
